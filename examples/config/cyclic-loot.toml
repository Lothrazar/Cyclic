#Cyclic loot-chest injection.
#Add items to vanilla chest loot tables without touching datapacks.
#Each list entry is a CSV string: modid:item,min,max,chance
#  min   = minimum stack size (>=1)
#  max   = maximum stack size (>= min)
#  chance = percent (0-100) that this entry rolls in a given chest
#Unknown items are skipped with a warning. Empty list = no injection.
#Delete a line to disable that entry; add as many lines per chest as you want.  Adding new/modded chests is supported if they are not already listed
[loot_inject]
	"chests.simple_dungeon" = ["cyclic:charm_speed,1,1,5", "cyclic:ender_bag,1,1,5", "cyclic:quiver_damage,1,1,12", "cyclic:copper_sword[damage=15],1,1,5", "cyclic:netherite_nugget,1,1,2", "cyclic:boomerang_damage,1,1,6", "cyclic:heart,1,1,1"]
	"chests.abandoned_mineshaft" = ["cyclic:charm_luck,1,1,5", "cyclic:apple_bone,2,6,30", "cyclic:copper_pickaxe,1,1,15", "cyclic:storage_bag,1,1,8", "cyclic:heart,1,1,2", "cyclic:netherite_nugget,1,1,2", "cyclic:boomerang_carry,1,1,6", "cyclic:gem_amber,1,1,1", "cyclic:gem_obsidian,1,1,1"]
	"chests.buried_treasure" = ["cyclic:charm_crit,1,1,15"]
	"chests.spawn_bonus_chest" = ["cyclic:sandstone_axe[enchantments={levels:{\"minecraft:unbreaking\":3}}],1,1,40", "cyclic:sandstone_shovel[enchantments={levels:{\"minecraft:unbreaking\":3}}],1,1,40", "cyclic:sleeping_mat,1,1,60", "cyclic:slingshot,1,1,40"]
	"chests.stronghold_corridor" = ["cyclic:heart,1,1,2", "cyclic:netherite_nugget,1,1,2", "cyclic:emerald_sword[enchantments={levels:{\"minecraft:unbreaking\":3}},lore=['{\"text\":\"Ancient\",\"color\":\"green\",\"italic\":true}'],custom_name='{\"text\":\"Whispering Edge\",\"italic\":false,\"color\":\"green\"}'],1,1,3"]
