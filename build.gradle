// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            // url "file://${project.projectDir}/repo"
            // url uri("${project.projectDir}/repo")
            url = uri("${project.projectDir}/repo")
        }
    }
}

apply from: 'gradle/deploy.gradle'

// Capture ext properties set by deploy.gradle into local vars so they are
// accessible inside the task closure (where ext resolves to the task's ext).
def cfApiKey  = ext.cfApiKey
def changelog = ext.changelog

// --- CurseForge ---
// Defined here (not deploy.gradle) so TaskPublishCurseForge resolves against
// the plugins {} block classpath.
tasks.register('publishCurseForge', TaskPublishCurseForge) {
  group       = 'publishing'
  description = 'Uploads the mod jar to CurseForge.'
  dependsOn jar

  apiToken = cfApiKey
  def mainFile = upload(curse_id, jar)
  mainFile.displayName   = "${mod_name} ${project.version}"
  mainFile.releaseType   = 'release'
  mainFile.addGameVersion(minecraft_version)
  mainFile.addGameVersion('NeoForge')
  mainFile.addGameVersion('Java 21')
  mainFile.changelog     = changelog
  mainFile.changelogType = 'markdown'

  doFirst {
    def coreKey = project.findProperty('curseforge_core_api_key') ?: ''
    def url = new URI("https://api.curseforge.com/v1/mods/${curse_id}/files").toURL()
    def connection = url.openConnection()
    connection.setRequestProperty('x-api-key', coreKey)
    connection.setRequestProperty('Accept', 'application/json')
    def response = new groovy.json.JsonSlurper().parse(connection.inputStream)
    if (response.data.any { it.displayName?.contains(project.version as String) }) {
      logger.warn("\n⚠️  CurseForge: version ${project.version} already exists for ${mod_name} — skipping upload.\n")
      throw new StopExecutionException()
    }
  }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('syncExampleConfigs') {
  group = 'documentation'
  description = 'Copies generated example config files from run/config/ into examples/.'

  doLast {
    def modId   = project.mod_id
    def srcDir  = file('run/config')
    def destDir = file('examples')

    if (!srcDir.exists()) {
      logger.lifecycle("[${project.name}] run/config/ not found — nothing to sync.")
      return
    }

    def found = [
      "${modId}.json",
      "${modId}.toml",
      "${modId}-common.toml",
      "${modId}-client.toml",
      "${modId}-server.toml"
    ].collect { new File(srcDir, it) }.findAll { it.exists() }

    if (found.isEmpty()) {
      logger.lifecycle("[${project.name}] No matching config files in run/config/ for '${modId}'.")
      return
    }

    destDir.mkdirs()
    found.each { src ->
      java.nio.file.Files.copy(
        src.toPath(),
        new File(destDir, src.name).toPath(),
        java.nio.file.StandardCopyOption.REPLACE_EXISTING
      )
      logger.lifecycle("[${project.name}] Synced: ${src.name} → examples/")
    }
  }
}
