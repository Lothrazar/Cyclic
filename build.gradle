}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            curse_slug             : curse_slug,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            flib_version           : flib_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// ???
//sourceSets.main.resources.srcDir 'src/main/templates'

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata
// Ensure standard processResources doesn't try to double-process the same files


// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}

apply from: 'gradle/deploy.gradle'

// Capture ext properties set by deploy.gradle into local vars so they are
// accessible inside the task closure (where ext resolves to the task's ext).
def cfApiKey  = ext.cfApiKey
def changelog = ext.changelog

// --- CurseForge ---
// Defined here (not deploy.gradle) so TaskPublishCurseForge resolves against
// the plugins {} block classpath.
// it will safely fail if the version already exists: will not overwrite or create a duplicate entry
tasks.register('publishCurseForge', TaskPublishCurseForge) {
  group       = 'publishing'
  description = 'Uploads the mod jar to CurseForge.'
  dependsOn jar

  apiToken = cfApiKey
  def mainFile = upload(curse_id, jar)
  mainFile.displayName   = "${mod_name} ${project.version}"
  mainFile.releaseType   = 'release'
  mainFile.addGameVersion(minecraft_version)
  mainFile.addGameVersion('NeoForge')
  mainFile.addGameVersion('Java 25')
  mainFile.addEnvironment('Client', 'Server')
  mainFile.changelog     = changelog
  mainFile.changelogType = 'markdown'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xmaxerrs', '20000']
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('syncExampleConfigs') {
  group = 'documentation'
  description = 'Copies generated example config files from run/config/ into examples/.'

  // Resolve everything project-related at configuration time so the task stays
  // compatible with the configuration cache (Task.project is unavailable at execution time).
  def modId       = project.mod_id
  def projectName = project.name
  def srcDir      = file('run/config')
  def destDir     = file('examples')

  doLast {
    if (!srcDir.exists()) {
      logger.lifecycle("[${projectName}] run/config/ not found nothing to sync.")
      return
    }

    def found = [
      "${modId}.json",
      "${modId}.toml",
      "${modId}-common.toml",
      "${modId}-client.toml",
      "${modId}-server.toml"
    ].collect { new File(srcDir, it) }.findAll { it.exists() }

    if (found.isEmpty()) {
      logger.lifecycle("[${projectName}] No matching config files in run/config/ for '${modId}'.")
      return
    }

    destDir.mkdirs()
    found.each { src ->
      Files.copy(
        src.toPath(),
        new File(destDir, src.name).toPath(),
        StandardCopyOption.REPLACE_EXISTING
      )
      logger.lifecycle("[${projectName}] Synced: ${src.name} → examples/")
    }
  }
}
