# Cyclic access transformers - 1.21 (Mojang official names)
#
# Format: <access>[-f] <class> <member>[<descriptor>]
#   public-f : make public AND remove final (use for fields you write to)
#   public   : make public, leave final-ness alone

# vanilla beacon beam section - extended by Cyclic's updateBeam in BeamHolder
public net.minecraft.world.level.block.entity.BeaconBlockEntity$BeaconBeamSection increaseHeight()V

# Player.sleepCounter - read/reset by SleepingMatItem fallback path
public-f net.minecraft.world.entity.player.Player sleepCounter

# Player.takeXpDelay - CharmBase resets this to disable the XP pickup cooldown
public-f net.minecraft.world.entity.player.Player takeXpDelay

# LivingEntity.updatingUsingItem - QuickdrawEnchant pokes the using-item state machine
public net.minecraft.world.entity.LivingEntity updatingUsingItem()V

# 26.1: HorseInventoryScreen no longer stores its own "horse" field at all (the constructor takes it but
# doesn't keep it) - the bound entity now only lives on AbstractMountInventoryMenu.mount instead.
# HorseCarrotOverlay needs it to draw its panel.
public net.minecraft.world.inventory.AbstractMountInventoryMenu mount

# BuddingAmethystBlock.randomTick - AmethystFluidBlock delegates amethyst growth to the vanilla block
public net.minecraft.world.level.block.BuddingAmethystBlock randomTick(Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/server/level/ServerLevel;Lnet/minecraft/core/BlockPos;Lnet/minecraft/util/RandomSource;)V

# 26.1: AbstractArrow#getBaseDamage() removed (setBaseDamage(double) still exists but no getter) -
# ItemEventHandler's quiver-damage charm needs to read the current value before boosting it.
public net.minecraft.world.entity.projectile.arrow.AbstractArrow baseDamage
